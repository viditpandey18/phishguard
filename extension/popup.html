<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- MV3 default CSP forbids inline script; logic lives in popup.js -->
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 10px; }
    textarea, input { width: 100%; box-sizing: border-box; margin: 4px 0; }
    #out { white-space: pre-wrap; margin-top: 8px; }
    .safe { color: #1a7f37; } .suspicious { color: #9a6700; } .phishing, .scam { color: #cf222e; }
  </style>
</head>
<body>
  <strong>PhishGuard</strong>
  <textarea id="content" rows="6" placeholder="Paste a message, email or URL"></textarea>
  <button id="scan">Scan</button>
  <div id="out"></div>
  <details><summary>Settings</summary>
    <input id="apiBase" placeholder="API base, e.g. http://localhost:8000">
    <input id="apiKey" placeholder="API key (optional)" type="password">
    <button id="save">Save</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
