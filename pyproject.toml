[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Defensive AI detection of scam messages, phishing emails and phishing URLs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "shap>=0.45", "pandas>=2.2", "joblib>=1.3"]
transformer = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.29"]
ui = ["streamlit>=1.33", "requests>=2.31"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
include = ["phishguard*"]

[tool.setuptools.package-data]
phishguard = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "B905", "B008"]  # B008: FastAPI Depends()/File() idiom
